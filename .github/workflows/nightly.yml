name: Nightly Tests

# Every night master moved: `bb test` (every unit suite in one job, as the
# release gate runs it), the fidelity round trips (`bb fidelity`), and, in a
# job of its own, the Playwright suites of igt, ud and umr, each on a private
# core with a fresh database (`bb e2e`). ci.yml runs the unit suites per push.
# The fidelity round trips and e2e run only here.
#
# Notification: GitHub emails the repository owner automatically when a
# SCHEDULED workflow run fails, so no extra notify step is needed. Wire a Slack
# / webhook step under `if: failure()` later if you want louder alerts.
#
# Cost guard: the cheap `check` job below gates the expensive jobs on "did
# master move since the last nightly?". Cron can't be made conditional, so we
# still spin up a few-second runner nightly, but the suites only run when
# there's a fresh commit. A skipped suite reports the run as
# success (skipped jobs don't fail a run), so quiet nights stay green and
# silent. `workflow_dispatch` always runs the suite regardless of commit age.
# The window is intentionally ~26h (not 24h) to absorb GitHub's schedule jitter
# — a false skip (missing a commit) is worse than an occasional redundant run.

on:
  schedule:
    # 07:00 UTC daily (~02:00-03:00 US Eastern). Cron uses UTC.
    - cron: '0 7 * * *'
  workflow_dispatch:   # allow manual "run now" from the Actions tab

permissions:
  contents: read

jobs:
  # Cheap gate: skip the suite on nights where master hasn't moved.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      recent: ${{ steps.check.outputs.recent }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        name: Commit since the last nightly?
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_h=$(( (now - last) / 3600 ))
          if [ $(( now - last )) -lt 93600 ]; then   # ~26h window
            echo "Last commit ${age_h}h ago — running suite."
            echo "recent=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last commit ${age_h}h ago — no changes since last nightly, skipping suite."
            echo "recent=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    # About 30 minutes with the fidelity round trips. A suite that hangs is
    # stopped here rather than at GitHub's 6 hours.
    timeout-minutes: 90
    if: needs.check.outputs.recent == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache Maven + gitlibs
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('plaid-core/deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-
      # The client goes in first and editable, so the assistant resolves its
      # `larc-plaid-client` dependency against THIS checkout rather than
      # against whatever is on PyPI.
      - name: Install the Python packages under test
        run: |
          python -m pip install --upgrade pip
          pip install -e ./plaid-client-py
          pip install -e './plaid-agent[dev]'
          # plaid-umr's comparison service scores with the ancast package, and
          # its tests run the real metric.
          pip install ancast
      # `bb test` is every suite: the Clojure core, all three SPAs, and the
      # Python assistant and services. Shared with release.yml and local dev
      # (bb/pipeline.clj), so the gate can't drift. The assistant's suite boots
      # a private plaid-core from source (the Java and Clojure set up above)
      # for igt's corpus tools, and fails if it cannot.
      - name: Run tests
        env:
          PLAID_PYTHON: python
        run: bb test
      # The fidelity round trips: the kitchen sink built on a core of their
      # own (their own port and database, booted from source), exported and
      # read back through every format that can, then handed to each format's
      # OWN validator. Nightly only, never per-commit or on the release path:
      # they cost five to ten minutes, and they are the only thing that
      # notices an importer quietly dropping something (`8add4f51` broke
      # `token.morphemeFormEmpty` and it was caught only because somebody ran
      # this by hand). `bb test` goes first, so plaid-igt is installed by the
      # time this runs. `realFiles.mjs` stays local: its corpora are real
      # files outside the repo.
      #
      # pycldf is what `validate.mjs` hands a CLDF export to, and xmllint
      # checks EAF, FlexInterlinear and LIFT against the schemas vendored in
      # plaid-igt/e2e/fidelity/schemas. The LaTeX book is compiled with
      # LuaLaTeX, from the TeX Live packages below (expex is in
      # texlive-humanities) with the fonts its preamble looks for.
      # PLAID_VALIDATORS_REQUIRED turns a missing validator into a failure,
      # so a check the gate counts on cannot quietly become a skip, and
      # PLAID_LATEX_REQUIRED does the same for the TeX engine.
      - name: Install the fidelity validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils \
            texlive-luatex texlive-latex-recommended texlive-humanities latexmk \
            fonts-sil-charis fonts-noto-core
          pip install pycldf
      - name: Run the fidelity round trips
        env:
          PLAID_PYTHON: python
          PLAID_VALIDATORS_REQUIRED: '1'
          PLAID_LATEX_REQUIRED: '1'
        run: bb fidelity

  # The Playwright suites, each on a plaid-core booted from source with a
  # fresh database and a Vite dev server of its own, one after another (about
  # 25 minutes on larc). `bb e2e` never installs anything, so the apps and
  # their browser go in first. The plaid-agent install lets the igt spec that
  # approves a plan run the real assistant, which `bb e2e` starts with the
  # pipeline's Python (PLAID_PYTHON).
  e2e:
    needs: check
    timeout-minutes: 90
    if: needs.check.outputs.recent == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache Maven + gitlibs
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('plaid-core/deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-
      - name: Install the apps and their browser
        run: |
          for d in plaid-ui plaid-igt plaid-ud plaid-umr; do (cd "$d" && npm ci); done
          for d in plaid-igt plaid-ud plaid-umr; do (cd "$d" && npx playwright install --with-deps chromium); done
      - name: Install the assistant
        run: |
          python -m pip install --upgrade pip
          pip install -e ./plaid-client-py
          pip install -e './plaid-agent[dev]'
      - name: Run the e2e suites
        env:
          PLAID_PYTHON: python
          PLAID_E2E_DIR: ${{ runner.temp }}/e2e
        run: bb e2e
      # Each suite's core, Vite and Playwright logs and its failure output.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-runs
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
