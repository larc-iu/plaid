name: Build and Deploy Docs

on:
  push:
    branches: [ master ]
    paths: [ 'bb/pipeline.clj', 'plaid-core/docs/**', 'plaid-ud/docs/**', 'plaid-igt/docs/**', 'plaid-umr/docs/**', 'plaid-client-js/src/**', 'plaid-client-py/src/**', 'plaid-ui/public/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        
    - name: Install Asciidoctor and CodeRay
      run: gem install asciidoctor coderay

    - name: Install Babashka
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        bb: latest

    - name: Build HTML
      # bb docs (bb/pipeline.clj) holds the page list. It only warns when the
      # API references fail, so the check after it makes that fatal here.
      run: |
        bb docs
        test -s _site/api-js.html && test -s _site/api-py.html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
