name: CI

# The per-push check, on every push to master and every pull request:
# Clojure formatting, the Clojure suite in four shards, every JavaScript
# package's lint, tests and Vite build (a job each), and the Python suites
# (with every Python tree compiled on 3.12 and on the 3.11 floor). Every job calls
# `bb ci-fast` (bb/pipeline.clj), so a developer runs the same thing locally.
#
# What runs elsewhere:
# - nightly.yml: `bb test` (the same suites in one job), the fidelity round
#   trips (`bb fidelity`) and the Playwright suites on private cores (`bb e2e`).
# - release.yml, on a tag: `bb test`, then `bb build` with the jar smoke test,
#   then the publish. Neither the fidelity round trips nor e2e run there.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A newer push to the same pull request stops the older run. Runs on master
# all finish, so every commit there gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Clojure suite in four shards, one JVM each, split by the recorded
  # per-namespace times (plaid-core/src/test-runner/test-timings.edn).
  core:
    name: core (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest
      - name: Cache Maven + gitlibs
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('plaid-core/deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-
      - name: Run the Clojure suite
        run: bb ci-fast core ${{ matrix.shard }}/4

  # Lint, tests and a Vite build of every JavaScript package, and the JS
  # client's suite, one job per package. `bb ci-fast js <package>` fails when
  # this list and the pipeline's packages differ.
  js:
    name: js (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [plaid-ui, plaid-ud, plaid-igt, plaid-dict, plaid-umr, plaid-client-js]
    steps:
      - uses: actions/checkout@v6
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest
      # Node 24: the lockfiles are written by npm 11, and npm 10 refuses them.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Lint, test and build ${{ matrix.package }}
        run: bb ci-fast js ${{ matrix.package }}

  # cljfmt, then the Python suites. The assistant's suite boots a private
  # plaid-core from source (hence Java and Clojure) and runs the apps' domain
  # modules in plain node for its mirror tests (hence Node and `npm ci`).
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      # 3.11 is the floor the packages declare, used only to compile every
      # tree (PLAID_PYTHON_FLOOR). The last version listed, 3.12, is `python`.
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.12
          cache: pip
          cache-dependency-path: |
            plaid-agent/pyproject.toml
            plaid-client-py/pyproject.toml
      - name: Cache Maven + gitlibs
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('plaid-core/deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-
      - name: Check the Clojure formatting
        run: bb ci-fast cljfmt
      # The client goes in first and editable, so the assistant resolves its
      # `larc-plaid-client` dependency against this checkout. plaid-umr's
      # comparison tests run the real ancast metric.
      - name: Install the Python packages under test
        run: |
          python -m pip install --upgrade pip
          pip install -e ./plaid-client-py
          pip install -e './plaid-agent[dev]'
          pip install ancast
      - name: Run the Python suites
        env:
          PLAID_PYTHON: python
          PLAID_PYTHON_FLOOR: python3.11
        run: bb ci-fast python
