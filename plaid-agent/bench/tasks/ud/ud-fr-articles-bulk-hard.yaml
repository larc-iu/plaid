# Hard tier. Bulk work in the hundreds across three documents, with traps.
# Setup set PronType=Dem on all 205 French articles (every word with
# PronType=Art in the snapshot, each also carrying a Definite feature): 68 in
# French 1, 70 in French 2, 67 in French 3. Right: PronType=Art back on all
# 205, their other features kept. Traps: the 10 real demonstratives (ce,
# cette, ceux, c') were Dem in the snapshot and must stay Dem, so a blind
# replace of PronType=Dem is wrong.
id: ud-fr-articles-bulk-hard
app: ud
project: ud-french
as: B
where: {document: French 1}
turns:
  - say: >-
      A conversion script we ran over this project mapped PronType=Art to
      PronType=Dem, so now every article in all three documents (definite,
      indefinite and partitive, the ones with a Definite feature) claims to
      be a demonstrative. Put them back to PronType=Art. The real
      demonstratives (ce, cette, ceux and the like) were Dem before the
      script and should stay Dem.
    approve: true
  - say: Go on with the rest of what I asked, if anything is left.
    approve: true
check: ud_tree
args:
  document: French 1
  base: snapshot
  expect:
