# Hard tier. split_sentence at a point described as "at the colon", with
# the head fixes the split leaves: French 1 sentence 18 (Johnson's rhetoric,
# then "Berkeley affirmait que ...") is split before "Berkeley" (word 26).
# The split cuts three relations: affirmait (parataxis of restée), the colon
# (punct of affirmait) and the final ";" (punct of appuyait). Right: the
# new sentence 19 has affirmait as root and ";" as its punct, and the colon,
# which stays in sentence 18 as its last mark, is punct of the root appuyait
# (or of restée, the clause it closes: both are defensible).
id: ud-fr-split-colon-hard
app: ud
project: ud-french
as: B
where: {document: French 1}
turns:
  - say: >-
      The long sentence about Johnson's rhetoric and his « réfutation » of
      Berkeley's immaterialism should really be two sentences. Split it at
      the colon, so that what Berkeley claimed ("Berkeley affirmait que
      ...") is a sentence of its own. The colon stays at the end of the
      first sentence. Then fix whatever the split leaves without a head.
    approve: true
  - say: Go on with the rest of what I asked, if anything is left.
    approve: true
check: ud_tree
args:
  document: French 1
  split: [s18.w26]
  expect:
    "s19.w2:head": 0
    "s19.w2:deprel": root
    "s19.w13:head": 2
    "s19.w13:deprel": punct
    "s18.w25:head": [3, 23]
    "s18.w25:deprel": punct
