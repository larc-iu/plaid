# Hard tier. Multi-turn, a plan carried into the next message in the ud
# assistant (turn 2 stages turn 1's fix again beside its own, since a plan is
# fixed once its turn ends. From the assistant survey).
# Setup writes every Aspect=Imp as Aspect=Impf (57 words, as
# ud-ru-corpus-aspect) and tags the 11 forms of быть VERB (as
# ud-ru-aux-multiturn-hard). Turn 1 asks for the aspect fix and is NOT
# approved. Turn 2 adds the быть fix and its plan is approved. Right: both
# fixes, the project back to the snapshot with the 68 changes stamped. A turn
# 2 plan that holds only the быть fix (turn 1's card silently replaced) fails.
id: ud-ru-resume-add-hard
app: ud
project: ud-russian
as: B
where: {document: Russian 1}
turns:
  - say: >-
      The imperfective aspect has been written Aspect=Impf throughout this
      project, but the UD value is Aspect=Imp. Please change every
      Aspect=Impf to Aspect=Imp in all three documents.
    approve: false
  - say: >-
      One more thing for the same batch: somebody tagged the forms of быть
      (был, была, было, были) as VERB everywhere. In this treebank быть is
      always AUX, so change those back to AUX too. Then I'll approve it all
      at once.
    approve: true
check: ud_tree
args:
  document: Russian 1
  # A project guideline stating the convention is what the assistant is
  # meant to draft when the user states one.
  allow_guidelines: true
  base: snapshot
  expect:
