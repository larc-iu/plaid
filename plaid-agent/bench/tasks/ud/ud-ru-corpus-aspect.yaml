# A corpus-wide consistent fix: 57 feature values in three documents. Setup
# wrote every Aspect=Imp as Aspect=Impf, which is not a UD value. Only that
# one feature of each word may change.
id: ud-ru-corpus-aspect
app: ud
project: ud-russian
as: B
where: {document: Russian 1}
turns:
  - say: >-
      The imperfective aspect has been written Aspect=Impf throughout this
      project, but the Universal Dependencies value is Aspect=Imp. Change
      every Aspect=Impf to Aspect=Imp, in all three documents, and change
      nothing else.
    approve: true
check: ud_tree
args:
  document: Russian 1
  base: snapshot
  expect:
    "Russian 1|s1.w17:feats": Aspect=Imp|Mood=Ind|Number=Sing|Person=3|Tense=Pres|VerbForm=Fin|Voice=Act
