# Two splits in one document, then two roots. A plan may carry only one
# split per document (a common plan_conflict), so this takes
# at least three plans: the turns after the first say only "go on". Setup
# merged Russian 2 sentences 4+5 and 10+11, each second root demoted under
# the first as parataxis. The end state is the snapshot's own document.
id: ud-ru-split-two
app: ud
project: ud-russian
as: B
where: {document: Russian 2}
turns:
  - say: >-
      In Russian 2, two sentences have each swallowed the sentence after
      them. Sentence 4 runs on into "Гомологическая алгебра -- ветвь
      алгебры ...", and sentence 9 runs on into "Жена Дзодзуашвили
      приходится ...". Split each one so that the swallowed sentence is its
      own sentence again, and make "ветвь" the root of the first new
      sentence and "приходится" the root of the second.
    approve: true
  - say: Go on with the rest of what I asked, if anything is left.
    approve: true
  - say: Go on with the rest of what I asked, if anything is left.
    approve: true
  - say: Go on with the rest of what I asked, if anything is left.
    approve: true
check: ud_tree
args:
  document: Russian 2
  base: snapshot
  expect:
    "s5.w4:head": 0
    "s5.w4:deprel": root
    "s11.w3:head": 0
    "s11.w3:deprel": root
