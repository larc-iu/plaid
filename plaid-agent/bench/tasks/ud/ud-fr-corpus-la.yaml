# A corpus-wide consistent fix: 33 lemmas in three documents. Setup gave
# every determiner "la" the lemma "la". One "la" in the project is not a
# determiner (Spanish, UPOS X, French 2 sentence 2) and keeps its lemma "la",
# so a blind replace of the lemma "la" is wrong.
id: ud-fr-corpus-la
app: ud
project: ud-french
as: B
where: {document: French 1}
turns:
  - say: >-
      Someone gave the definite article "la" the lemma "la" all over this
      project. In this treebank every form of the definite article (le, la,
      l', les) has the lemma "le". Set the lemma back to "le" for every
      determiner (UPOS DET) "la", in all three documents.
    approve: true
check: ud_tree
args:
  document: French 1
  base: snapshot
  expect:
    "French 1|s1.w6:lemma": le
    "French 1|s6.w29:lemma": le
    "French 1|s8.w10:lemma": le
    "French 1|s12.w10:lemma": le
    "French 1|s13.w15:lemma": le
    "French 1|s14.w36:lemma": le
    "French 1|s18.w29:lemma": le
    "French 1|s19.w18:lemma": le
    "French 1|s20.w31:lemma": le
