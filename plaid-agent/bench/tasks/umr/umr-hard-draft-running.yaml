# Hard tier. Loose drafting: the last sentence's graph is gone, and the
# request describes it by analogy ("like the walking one") rather than node
# by node. Matched on its key parts: yapana root with :aspect activity, a
# 3rd person actor, ɨwɨrati as :place, ay "already" as :temporal or :mod,
# and no node for yupuni "start". Other attributes are free.
id: umr-hard-draft-running
app: umr
project: umr-kukama
as: B
where: {document: Kukama text 2}
turns:
  - say: >-
      The last sentence of the story lost its graph. It's ay ra yupuni
      yapana ɨwɨrati, "he already starts running in the forest" (ay
      already, ra he, yupuni start, yapana run, ɨwɨrati forest). Could you
      put one back, done the way the walking sentence a bit earlier is
      done ("he has already walked a lot")? Running is an activity, and
      leave the "start" out.
    approve: true
check: umr_graph
args:
  document: Kukama text 2
  draft:
    sentence: 19
    root: y
    nodes:
      y: {concept: yapana, attrs: {":aspect": activity}, attrs_at_least: true}
      p: {concept: person, attrs: {":refer-person": 3rd}, attrs_at_least: true}
      x: {concept: ɨwɨrati, attrs_at_least: true}
      a: {concept: [ay, already], attrs_at_least: true}
    edges:
      - [y, ":actor", p]
      - [y, ":place", x]
      - [y, [":temporal", ":mod"], a]
