# Hard tier. Bulk: :modal-strength wiped from all 33 nodes with an :aspect
# and put back, full-negative on the four events the text negates (found by
# meaning: ni "NEG" in the line), full-affirmative on the rest. Traps: a
# concept-wide write (set_attribute_for_concept) also reaches the aya and
# ichima nodes with no aspect, and purara is negated in two of its four
# sentences.
id: umr-hard-modal-sweep
app: umr
project: umr-kukama
as: B
where: {document: Kukama text 2}
turns:
  - say: >-
      Ugh, a script I ran stripped the modal strength off every event in this
      story. Can you put it back? By event I mean every node that has an
      aspect, whatever its concept, and nothing else. They're all
      full-affirmative except the things the story says did not happen
      (the ones with ni, "not"): him not remembering where his way was, him
      not finding his way (both times, also where it's the reason he's
      scared), and him not knowing how he got in. Those are full-negative.
    approve: true
check: umr_graph
args:
  document: Kukama text 2
  expect:
    "s1.s1x::modal-strength": full-affirmative
    "s1.s1u::modal-strength": full-affirmative
    "s1.s1c::modal-strength": full-affirmative
