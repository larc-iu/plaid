# Corpus-wide consistent glossing: 65 glosses changed over five documents
# (replace_in_field or set_field_for_form).
id: igt-gloss-rename
app: igt
project: igt-natugu
as: B
where: {document: Natugu text 1}
turns:
  - say: >-
      We are changing a convention. Everywhere in the project, the morpheme mz
      glossed PREP should be glossed LOC instead. Change all of them, in every
      text. The mz morphemes glossed eye stay as they are.
    approve: true
check: igt_changes
args:
  rules:
    - gloss: {form: mz, from: PREP, to: LOC}
  # "Everywhere in the project" may well take the lexicon in: the lexicon's
  # PREP sense of mz renamed beside the texts is no fault (REV-JG3, the lead's
  # reading, 2026-11-13). igt-bulk-abbrev-hard and igt-migrate-glosses-hard,
  # whose users name the texts alone, count it collateral.
  optional:
    "LEX|mz|PREP:gloss": LOC
  # The user states a convention and asks for no guideline, so one drafted is
  # collateral (the owner's ruling of 2026-11-12: drafted only when asked).
