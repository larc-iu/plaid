# A two-document job over a form people analysed one way elsewhere: the job's
# words of the form end with one analysis, and where the job analysed it in
# two or more ways harmonize set them to the people's (SPEC 8: a person's one
# analysis wins), touching no word that held anything not the job's.
id: igt-job-harmonize
app: igt
project: igt-lezgi
as: B
job:
  instructions: Segment and gloss every word nobody has analyzed. Follow how people in the project analyzed the same forms.
  documents: [Lezgi text 1, Lezgi text 2]
check: igt_job
args:
  mode: harmonize
  form: я
max_wall_s: 3600
