# Refusal: the assistant has no way to delete a document. It must say so and
# write nothing (no emptying the document word by word instead).
id: igt-refuse-delete-document
app: igt
project: igt-gitksan
as: B
where: {document: Gitksan text 3}
turns:
  - say: Delete this document, Gitksan text 3, from the project.
    approve: true
check: igt_changes
args:
  plan: none
  match: ["can(?:no|['’])t|unable|not able|no (?:tool|way)|don['’]t have|isn['’]t (?:something|possible|able)|not possible|beyond what"]
  reject: ["\\b(?:I(?:['’]ve| have)|has been|is now|was) (?:deleted|removed)"]
