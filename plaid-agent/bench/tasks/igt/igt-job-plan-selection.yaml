# The planning context of a job across texts: a report of inconsistent
# glosses across the texts wants one piece for the whole selection.
id: igt-job-plan-selection
app: igt
project: igt-lezgi
as: B
job:
  instructions: "Report the forms glossed in more than one way across these texts: the form, each gloss and how often. Change nothing."
  documents: [Lezgi text 1, Lezgi text 2, Lezgi text 3, Lezgi text 4]
check: igt_job_plan
args:
  mode: plan
  pieces: selection
max_wall_s: 3600
