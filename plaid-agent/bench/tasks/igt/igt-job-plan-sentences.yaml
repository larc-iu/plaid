# The planning context of a glossing job (JG, the owner's ruling 14): work
# judged word by word wants stretches of sentences. Five blank sentences of
# Lezgi text 1, as igt-job-stretch has them. A plan in sentences walks every
# sentence unless plan_work says skip_filled_sentences, kept in the plan as
# only_empty (BRIEF EW, OE, DF1), and these instructions only fill words nobody
# analysed: the plan must say only_empty.
id: igt-job-plan-sentences
app: igt
project: igt-lezgi
as: B
job:
  instructions: "Segment and gloss every word nobody has analyzed. Follow how people in the project analyzed the same forms."
  documents: [Lezgi text 1]
check: igt_job_plan
args:
  mode: plan
  pieces: sentences
  only_empty: true
max_wall_s: 3600
