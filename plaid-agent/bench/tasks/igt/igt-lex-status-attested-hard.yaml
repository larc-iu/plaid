# Hard tier. Lexicon work that joins the corpus and the lexicon (lexicon() in
# run_code gives every item with its fields and link count). Setup links every
# morpheme of texts 1 and 3 to its entry or sense (101 items) and gives six
# items a status: four linked ones (hl CN, dim PROSP, wila MANR reviewed,
# bisde'y published) and two unlinked ones (gyet reviewed, dulp draft). Right:
# status draft on the 97 linked items that had none, nothing else. Traps: the
# four linked items that already have a status, the 56 unlinked items, and
# headwords whose links are all on their senses.
id: igt-lex-status-attested-hard
app: igt
project: igt-gitksan
as: B
where: {lexicon: Lexicon}
turns:
  - say: >-
      I want everything in the lexicon that's actually used in the texts to
      go into our review workflow. Every entry or sense that at least one
      word or morpheme is linked to directly should get the status draft,
      unless it already has a status. Leave items nothing links to alone,
      and a headword whose links are all on its senses doesn't count as
      used itself.
    approve: true
check: igt_changes
