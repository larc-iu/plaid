# analyze_sentence (AS, 2026-11-14): a sentence analysed and linked from the
# interlinear lines a user pastes. Right is sentence 14 of Gitksan text 2
# analysed word for word as given, each morpheme linked to its existing entry
# (the lexicon has one for each form and gloss), and no new entry. Run4 of the
# job pilot put such a sentence's morphemes all on its first word: the tool
# refuses that, and the checker sees nothing written.
id: igt-lines-sentence
app: igt
project: igt-gitksan
as: B
where: {document: Gitksan text 2}
turns:
  - say: |-
      Sentence 14 of this text has no analysis. Enter this one and link every morpheme to its entry in the lexicon:

      ii ji-da hlen-txw-'y dim ii gipaykw bisde'y
      CCNJ IRR-SPT move-PASS-1SG.II PROSP CCNJ fly grouse
    approve: true
check: igt_changes
args:
  expect:
    "Gitksan text 2|s14.w1.m1:form": "ii"
    "Gitksan text 2|s14.w1.m1:Gloss": "CCNJ"
    "Gitksan text 2|s14.w1.m1:link": "ii|CCNJ"
    "Gitksan text 2|s14.w2.m1:form": "ji"
    "Gitksan text 2|s14.w2.m1:Gloss": "IRR"
    "Gitksan text 2|s14.w2.m1:link": "ji|IRR"
    "Gitksan text 2|s14.w2.m2:form": "da"
    "Gitksan text 2|s14.w2.m2:Gloss": "SPT"
    "Gitksan text 2|s14.w2.m2:link": "da|SPT"
    "Gitksan text 2|s14.w3.m1:form": "hlen"
    "Gitksan text 2|s14.w3.m1:Gloss": "move"
    "Gitksan text 2|s14.w3.m1:link": "hlen|move"
    "Gitksan text 2|s14.w3.m2:form": "txw"
    "Gitksan text 2|s14.w3.m2:Gloss": "PASS"
    "Gitksan text 2|s14.w3.m2:link": "txw|PASS"
    "Gitksan text 2|s14.w3.m3:form": "'y"
    "Gitksan text 2|s14.w3.m3:Gloss": "1SG.II"
    "Gitksan text 2|s14.w3.m3:link": "'y|1SG.II"
    "Gitksan text 2|s14.w4.m1:form": "dim"
    "Gitksan text 2|s14.w4.m1:Gloss": "PROSP"
    "Gitksan text 2|s14.w4.m1:link": "dim|PROSP"
    "Gitksan text 2|s14.w5.m1:form": "ii"
    "Gitksan text 2|s14.w5.m1:Gloss": "CCNJ"
    "Gitksan text 2|s14.w5.m1:link": "ii|CCNJ"
    "Gitksan text 2|s14.w6.m1:form": "gipaykw"
    "Gitksan text 2|s14.w6.m1:Gloss": "fly"
    "Gitksan text 2|s14.w6.m1:link": "gipaykw|fly"
    "Gitksan text 2|s14.w7.m1:form": "bisde'y"
    "Gitksan text 2|s14.w7.m1:Gloss": "grouse"
    "Gitksan text 2|s14.w7.m1:link": "bisde'y|grouse"
