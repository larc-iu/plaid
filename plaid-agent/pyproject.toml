[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "larc-plaid-agent"
version = "0.0.0"
description = "Bring-your-own-model LLM assistant services for Plaid projects"
requires-python = ">=3.11"
# The client floor is stamped to the release version at build time (bb build).
# httpx already arrives with litellm, but the web tools use it directly.
# pydantic-monty is the sandbox run_code runs in; its worker binary ships in
# the wheel per platform, and the tool is withheld where it is missing. 1.0
# renamed the checkout limits (max_duration_secs is refused), so it stays below 1.
# pypdfium2 (PDFium, Apache-2.0 or BSD-3) reads the PDFs read_url fetches. Never
# PyMuPDF, which is AGPL.
# litellm stays below 1.106: from 1.106.0 every completion that passes tools
# imports litellm's proxy MCP handler, which needs the `mcp` package litellm only
# installs with its proxy or mcp extra, so each turn failed with "No module
# named 'mcp'" (1.106.0 to 1.106.4 all do).
dependencies = ["larc-plaid-client", "litellm>=1.70,<1.106", "httpx", "pydantic-monty>=0.0.23,<1", "regex",
                "pypdfium2>=5,<6"]

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]

# One distribution, one service per app. The harness they share is subtle
# enough (the request lifecycle, the record's ownership, the batching) to want
# a single copy that moves with all of them, and an operator installing Plaid
# gets the assistant for whichever app they run.
[project.scripts]
plaid-igt-agent = "plaid_agent.igt.service:main"
plaid-ud-agent = "plaid_agent.ud.service:main"
plaid-umr-agent = "plaid_agent.umr.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plaid_agent"]
