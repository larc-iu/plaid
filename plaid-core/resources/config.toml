# =============================================================================
# Plaid server configuration
# =============================================================================
#
# This file is written automatically to data/config.toml on first launch with
# every setting set to its default. Edit it and restart the server to apply
# changes. Settings left out of this file fall back to the defaults shown here,
# so you can delete anything you don't want to override.
#
# To load config from a different location, pass `--config /path/to/config.toml`
# on the command line, or set the PLAID_CONFIG environment variable.
#
# NOTE: the JWT signing secret is NOT configured here. It is read from the
# PLAID_JWT_SECRET environment variable, or auto-generated into
# data/jwt-secret.txt (owner-only permissions) on first launch.

# -----------------------------------------------------------------------------
# HTTP server
# -----------------------------------------------------------------------------
[server]
# Port the HTTP API listens on.
port = 8080

# Maximum size (in megabytes) of a non-multipart request body (e.g. JSON/EDN
# REST payloads). Multipart media uploads are capped separately by
# [media] max_file_size_mb.
max_json_body_mb = 10

# Serve static files from this filesystem directory (UNAUTHENTICATED —
# anything under it becomes public). Disabled unless set; the bundled
# /ud and /igt apps are served from the jar regardless. Advanced; most
# deployments never set this.
# static_resources_path = "/srv/plaid-static"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[logging]
# Minimum log level for Plaid's OWN code. One of:
# trace, debug, info, warn, error, fatal, report.
# At "info" you get one line per HTTP request (method, path, status, timing)
# plus startup/shutdown; warnings and errors always surface. Use "debug" to
# additionally see full request/response bodies (sensitive fields redacted)
# and other granular detail.
level = "info"

# Log level for THIRD-PARTY libraries (database connection pool, SQLite driver,
# HTTP server, file-type detection, ...). These are chatty at "info", so the
# default keeps them quiet unless something needs attention. Raise to
# "info"/"debug" when diagnosing a library-level problem. Applied once at
# startup — changing it needs a restart.
library_level = "warn"

# Write logs to a FILE (rotated daily; previous days kept as "<file>.YYYYMMDD")
# instead of stdout. Leave commented to log to stdout — recommended when running
# under systemd or Docker, which capture and rotate stdout for you.
# file = "data/plaid.log"

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
[auth]
# Session token (JWT) lifetime, in seconds. Default is 30 days (2592000).
# Shorten for tighter-security deployments.
jwt_ttl_seconds = 2592000
# Lifetime, in seconds, of the short-lived token the server mints for a user
# when they submit work to a service that acts on their behalf (a "delegating"
# service such as the IGT assistant). Default is one hour.
# delegated_token_ttl_seconds = 3600

# -----------------------------------------------------------------------------
# API surface
# -----------------------------------------------------------------------------
[api]
# Whether to expose the auto-generated OpenAPI spec at /api/v1/openapi.json.
# Set to false to reduce surface area on hardened deployments.
expose_openapi = true

# -----------------------------------------------------------------------------
# Media uploads
# -----------------------------------------------------------------------------
[media]
# Maximum size (in megabytes) of a single uploaded media file.
max_file_size_mb = 200

# Profile pictures. Every upload is decoded, center-cropped to a square,
# scaled to avatar_size_px on each edge, and re-encoded before it is stored,
# so these govern the stored result and not just what clients may send.
# Raising avatar_size_px does not resize pictures already stored: those keep
# the edge length they were uploaded at until they are replaced.
avatar_size_px = 512

# Largest profile-picture upload accepted, in megabytes. This bounds the file
# that arrives, not the file that is kept: normalization takes nearly every
# real photo well under it.
avatar_max_upload_mb = 5

# -----------------------------------------------------------------------------
# Database
# -----------------------------------------------------------------------------
[database]
# Storage backend: "sqlite" (the default) or "postgres".
#
# SQLite is what almost every deployment should use. It needs no server, no
# credentials and no maintenance, the whole database is one file you can copy,
# and Plaid's nightly backups only exist for it. Postgres is here for the
# deployments that already run one and want Plaid's data alongside everything
# else they back up and monitor. It is NOT faster: Plaid serializes writers on
# either backend (see plaid.sql.dialect), so a single instance behaves the
# same way on both.
#
# There is no migration path between the two. Pick one before you have data.
# backend = "sqlite"

# --- SQLite ------------------------------------------------------------------
# Path to the SQLite database file. Created (with its parent directory) on
# first launch if absent. Ignored when backend = "postgres".
#
# BACKUPS: the server takes automatic nightly snapshots — see the [backup]
# section below. For an ad-hoc manual backup while the server runs, note the
# database is in WAL mode, so a plain file copy of the .db misses
# un-checkpointed writes in the -wal sidecar; use the SQLite backup API instead:
#   sqlite3 data/plaid.db ".backup /path/to/backup-$(date +%F).db"
path = "data/plaid.db"

# --- Postgres ----------------------------------------------------------------
# Required when backend = "postgres". Plaid creates its own tables on first
# launch. Create an EMPTY database and a role that owns it, and point `url` at
# it. Anything already in the `public` schema is left alone.
#
#   createdb plaid && createuser plaid --pwprompt
#
# BACKUPS: the [backup] section below does NOT apply. It is implemented with
# SQLite's VACUUM INTO and the scheduler declines to start here. Use pg_dump,
# WAL archiving, or your provider's snapshots.
#
# COLLATION: Plaid declares COLLATE "C" on its own TEXT columns, so ordering
# matches SQLite's byte order regardless of the locale the database was created
# with. Nothing to configure.
#
# url = "jdbc:postgresql://localhost:5432/plaid"
# user = "plaid"
# password = "..."

# --- Where non-database state lives ------------------------------------------
# Uploaded media, extracted service scripts, and (on SQLite) backups live under
# one directory. It defaults to the parent of `path` above, which is what makes
# the out-of-the-box data/ layout work with no configuration. Postgres has no
# local file to take a parent from, so set it explicitly there.
# data_dir = "data"

# Minimum / maximum allowed length for user-supplied names (projects, layers,
# documents, etc.).
min_name_length = 1
max_name_length = 500

# Queries slower than this many milliseconds are logged. Uncomment to override
# (default 500).
# slow_query_threshold_ms = 500

# --- Connection pool + SQLite PRAGMA tuning (advanced) -----------------------
# Uncomment and adjust any of these to override the defaults. The three PRAGMA
# knobs are SQLite-only and are ignored on Postgres.
# max_pool_size = 10            # HikariCP maximum pool size
# connection_timeout_ms = 30000 # HikariCP connection timeout
# busy_timeout_ms = 5000        # SQLite busy_timeout PRAGMA
# journal_mode = "WAL"          # SQLite journal_mode PRAGMA
# synchronous = "NORMAL"        # SQLite synchronous PRAGMA

# -----------------------------------------------------------------------------
# Nightly database backups (SQLite only)
# -----------------------------------------------------------------------------
# Once a day the server writes a consistent, compacted snapshot of the SQLite
# database (via `VACUUM INTO` — safe while the server runs, WAL and all), zips
# it, and drops it in `directory` as plaid-backup-<timestamp>.zip. Only the
# most recent `retention` zips are kept; older ones are pruned automatically.
[backup]
# Turn the nightly backup on or off.
enabled = true
# Directory the dated backup zips are written to. Created (with parents) on the
# first run. Relative paths resolve against the server's working directory.
directory = "data/backups"
# How many of the most recent backups to keep.
retention = 5
# Wall-clock time of day to run the backup, 24-hour "HH:MM" (server local time).
time = "03:00"

# -----------------------------------------------------------------------------
# CORS (cross-origin requests)
# -----------------------------------------------------------------------------
# By default no cross-origin requests are allowed: frontends must be served
# from the same origin as the API.
[cors]
# Exact origin strings to allow (NOT regexes), e.g.
#   allowed_origins = ["https://app.example.com", "https://staging.example.com"]
# Each entry is anchored and matched exactly. Empty list = same-origin only.
allowed_origins = []

# HTTP methods permitted for cross-origin requests.
allowed_methods = ["get", "put", "post", "patch", "delete", "options"]

# Request headers permitted for cross-origin requests.
allowed_headers = ["Authorization", "Content-Type"]

# -----------------------------------------------------------------------------
# Document locks
# -----------------------------------------------------------------------------
[locks]
# How long (milliseconds) a document lock is held before it expires.
expiration_ms = 60000

# -----------------------------------------------------------------------------
# Real-time events (SSE)
# -----------------------------------------------------------------------------
[events]
# Heartbeat interval (milliseconds) for server-sent-event streams.
heartbeat_interval_ms = 30000
# Number of consecutive missed heartbeats before a client is dropped.
heartbeat_max_misses = 2
