{% extends "base.html" %}
{% block title %}Log in · dig4el{% endblock %}
{% block content %}
<article style="max-width: 28rem; margin: 3rem auto;">
  <h2>Log in</h2>
  <p class="muted">Use your Plaid account.</p>
  {% if error %}<p><mark>{{ error }}</mark></p>{% endif %}
  <form method="post" action="/login">
    <label>Email <input type="text" name="user_id" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
</article>
{% endblock %}
