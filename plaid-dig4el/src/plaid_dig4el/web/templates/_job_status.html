<div class="alert alert-info d-flex align-items-center gap-2 mb-0" id="job-status" hx-get="/languages/{{ language_id }}/jobs/{{ job.id }}/status" hx-trigger="every 3s" hx-swap="outerHTML">
  <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
  <span>
    {% if job.status == 'queued' %}Waiting to start…
    {% elif job.progress.total is defined %}{{ job.progress.done }} of {{ job.progress.total }} sentences described.
    {% else %}Reading the sentences…{% endif %}
    {% if job.progress.note %}<br><small class="text-secondary">{{ job.progress.note }}</small>{% endif %}
  </span>
</div>
